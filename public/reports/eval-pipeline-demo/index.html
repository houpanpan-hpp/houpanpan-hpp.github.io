<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>评测管线示例报告</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #fafafa;
        --fg: #1f1f1f;
        --muted: #6b7280;
        --accent: #2563eb;
        --border: #e5e7eb;
        --card: #ffffff;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 28px 32px 36px;
        background: var(--bg);
        color: var(--fg);
        font: 14px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      }
      h1 { margin: 0 0 4px; font-size: 20px; }
      .sub { margin: 0 0 24px; color: var(--muted); font-size: 13px; }
      .grid {
        display: grid;
        gap: 12px;
        grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
        margin-bottom: 24px;
      }
      .stat {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 14px 16px;
      }
      .stat .k { color: var(--muted); font-size: 12px; }
      .stat .v { font-size: 22px; font-weight: 600; margin-top: 4px; }
      .stat .delta-up { color: #16a34a; font-size: 12px; margin-left: 6px; }
      .stat .delta-down { color: #dc2626; font-size: 12px; margin-left: 6px; }
      .bars {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 16px 18px;
      }
      .bars h2 { margin: 0 0 14px; font-size: 14px; }
      .row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
      .row .name {
        width: 110px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px; color: var(--muted);
      }
      .row .track {
        flex: 1; height: 14px; background: #f3f4f6; border-radius: 6px; overflow: hidden;
      }
      .row .fill { height: 100%; background: var(--accent); border-radius: 6px; }
      .row .pct { width: 52px; text-align: right; font-size: 12px; color: var(--muted); }
      footer { margin-top: 22px; color: var(--muted); font-size: 12px; }
    </style>
  </head>
  <body>
    <h1>评测管线示例报告</h1>
    <p class="sub">Mock 数据 / 仅作样式占位</p>

    <div class="grid">
      <div class="stat"><div class="k">总样本</div><div class="v">2,048</div></div>
      <div class="stat"><div class="k">通过率</div><div class="v">87.3%<span class="delta-up">+2.1</span></div></div>
      <div class="stat"><div class="k">平均时延</div><div class="v">1.42s<span class="delta-down">+0.08</span></div></div>
      <div class="stat"><div class="k">Token / 样本</div><div class="v">682</div></div>
    </div>

    <section class="bars">
      <h2>分类目通过率</h2>
      <div class="row">
        <div class="name">code</div>
        <div class="track"><div class="fill" style="width:91%"></div></div>
        <div class="pct">91%</div>
      </div>
      <div class="row">
        <div class="name">math</div>
        <div class="track"><div class="fill" style="width:78%"></div></div>
        <div class="pct">78%</div>
      </div>
      <div class="row">
        <div class="name">qa</div>
        <div class="track"><div class="fill" style="width:88%"></div></div>
        <div class="pct">88%</div>
      </div>
      <div class="row">
        <div class="name">tool-use</div>
        <div class="track"><div class="fill" style="width:84%"></div></div>
        <div class="pct">84%</div>
      </div>
      <div class="row">
        <div class="name">long-ctx</div>
        <div class="track"><div class="fill" style="width:69%"></div></div>
        <div class="pct">69%</div>
      </div>
    </section>

    <footer>Generated 2026-05-17 · run_id mock-0001</footer>
  </body>
</html>
